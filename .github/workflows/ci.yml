name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck, lint, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes, so the token does not need to stay in the checkout.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The core also runs inside GNOME Shell and the daemon, so check it under GJS too. The
      # build compiles the GSettings schemas (glib-compile-schemas, from libglib2.0-bin).
      - name: Install GJS and GLib tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gjs libglib2.0-bin
      - run: npm run test:gjs

      - run: npm run pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: islet-extension
          path: islet@jagosar.github.io.zip
          if-no-files-found: error
